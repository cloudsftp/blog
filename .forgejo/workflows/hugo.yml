name: Deploy Hugo site to git-pages

on:
  push:
    branches:
      - latest

jobs:
  build:
    runs-on: debian
    env:
      HUGO_VERSION: 0.162.1
    steps:
      - name: Install Git LFS
        run: |
          apt update
          apt install git-lfs -y

      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-arm64.deb
          dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install Dart Sass
        run: npm install -g sass
          
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true
          token: ${{ forge.token }}

      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://cloudsftp.de/"

      - uses: actions/git-pages@v2
        with:
          site: https://cloudsftp.de/
          server: pages.energiesandsuch.com
          token: ${{ forge.token }}
          source: ./public/
